name: Manual Build and Deploy

# A manually-triggered copy of docker-publish.yml: enter a tag (e.g. v0.11.0)
# and it releases it — creating the tag on the dispatched ref if it doesn't
# exist yet, then building and deploying exactly like a tag push. Tags created
# here use the workflow's GITHUB_TOKEN, which never re-triggers the tag-push
# workflow, so there is no double build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.11.0)"
        required: true
        type: string

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          TAG="${{ inputs.tag }}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' must look like v0.11.0"
            exit 1
          fi

      - name: Create the tag if it does not exist
        run: |
          TAG="${{ inputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — releasing it as-is."
          else
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
            echo "Created tag $TAG at $(git rev-parse --short HEAD)."
          fi

  build:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: damienh/rami
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_VERSION=${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: damhau/k8s-argocd
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tag
        run: |
          TAG_INPUT="${{ inputs.tag }}"
          TAG=${TAG_INPUT#v}
          cd base/applications/rami
          kustomize edit set image damienh/rami=damienh/rami:${TAG}

      - name: Commit and push
        run: |
          TAG_INPUT="${{ inputs.tag }}"
          TAG=${TAG_INPUT#v}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base/applications/rami/kustomization.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: deploy rami ${TAG}"
          git push origin main
